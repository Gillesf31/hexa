<h1>Appointments</h1>

<div class="appointments">
  @for (appointment of appointments(); track appointment.id) {
    <div class="card">
      <div class="card-header">
        <span class="customer">{{ appointment.customerName }}</span>
        <span class="duration">{{ appointment.durationMinutes }} min</span>
      </div>
      <div class="card-body">
        <span class="date">📅 {{ appointment.date }}</span>
        <span class="time">🕐 {{ appointment.startTime }}</span>
      </div>
    </div>
  } @empty {
    <p class="empty">No appointments found.</p>
  }
</div>
